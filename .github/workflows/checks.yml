# What can be checked with no radio: the AirDrop layer over loopback, and the
# app's own checks. The driver, the radio daemon and the AWDL daemon need the
# Windows Driver Kit, vcpkg and the card, and are not built here.
name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  airdrop:
    name: AirDrop layer, Python ${{ matrix.python }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest version the README names, and the one it is written on.
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Style
        run: |
          python -m pip install ruff==0.15.10
          python -m ruff check airdrop
      - name: Tests, over loopback
        run: python -m unittest discover -s airdrop\tests

  app:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build app\winawdl.csproj -c Release -nologo
      - name: Checks that need no radio and no window
        shell: pwsh
        run: |
          $out = "$PWD\build\app\check"
          # The app has no console, so its exit is waited for and its log read.
          $run = Start-Process build\app\winawdl\winawdl.exe -ArgumentList '--check', "`"$out`"" -Wait -PassThru
          if (Test-Path "$out\check.log") { Get-Content "$out\check.log" }
          exit $run.ExitCode

  mediatek:
    name: MediaTek control and protocol, no hardware
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: OEM profile checks
        shell: pwsh
        run: .\scripts\build-mediatek.ps1 -Check
      - name: Native build and protocol checks
        shell: pwsh
        run: .\driver\mediatek\build.ps1 -SkipDriver -Check
      - name: Recovery checks, no device access
        shell: powershell
        run: .\scripts\tests\mediatek-recovery.ps1
